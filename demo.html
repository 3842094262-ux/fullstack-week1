<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DOM 练习</title>
</head>
<body>
  <h1 id="title">原始标题</h1>
  <input type="text" id="myInput" placeholder="输入点什么..." />
  <button id="myBtn">点我修改标题</button>

  <script>
    // 1. 找到页面上的元素（像 CSS 选择器一样）
    const title = document.querySelector("#title");
    const input = document.querySelector("#myInput");
    const btn = document.querySelector("#myBtn");
        btn.addEventListener("click", function () {
      // 3. 获取输入框里的内容
      const userText = input.value;
      
      // 4. 直接修改标题
      title.innerText = userText;
    }); // <--- 加上这一行！把函数关上！
  </script>
